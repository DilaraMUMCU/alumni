# ==============================================================================
# Alumni Tracking & Community Networking System
# Docker Compose Orchestration Configuration
#
# Aligned with Data Design Documentation (ddd.md) & Architecture (README.md):
# - Web Server: Nginx 1.25+ Alpine (Reverse proxy & Front Controller, Port 8000)
# - Application: PHP 8.2-FPM with Composer, PDO, and Extensions
# - Database: MySQL 8.0 Relational Storage (InnoDB, UTF8mb4, Port 3306)
# - In-Memory Cache: Redis Alpine (Fast Cache & Session Subsystem, Port 6379)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PHP-FPM Application Service (Core MVC Controller & Model Layer)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: alumni-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-alumni}
      DB_USERNAME: ${DB_USERNAME:-alumni}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: ${CACHE_STORE:-file}
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alumni-network

  # ----------------------------------------------------------------------------
  # 2. Nginx Web Server Service (HTTP Front Controller & Reverse Proxy)
  # ----------------------------------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: alumni-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - alumni-network

  # ----------------------------------------------------------------------------
  # 3. MySQL 8.0 Relational Database Service (Data Persistence Layer - ddd.md)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: alumni-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alumni}
      MYSQL_USER: ${DB_USERNAME:-alumni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - alumni-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alumni-network

  # ----------------------------------------------------------------------------
  # 4. Redis In-Memory Cache Service (Cache & Session Store - ddd.md Section 1.1)
  # ----------------------------------------------------------------------------
  cache:
    image: redis:alpine
    container_name: alumni-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - alumni-cachedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - alumni-network

# ------------------------------------------------------------------------------
# Networks Definition
# ------------------------------------------------------------------------------
networks:
  alumni-network:
    name: alumni-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volumes Definition
# ------------------------------------------------------------------------------
volumes:
  alumni-dbdata:
    name: alumni-dbdata
    driver: local
  alumni-cachedata:
    name: alumni-cachedata
    driver: local
