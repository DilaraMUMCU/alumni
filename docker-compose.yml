
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: alumni-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - alumni-network

  webserver:
    image: nginx:alpine
    container_name: alumni-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - alumni-network

  db:
    image: mysql:8.0
    container_name: alumni-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alumni
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: alumni
    ports:
      - "3306:3306"
    volumes:
      - alumni-dbdata:/var/lib/mysql
    networks:
      - alumni-network

networks:
  alumni-network:
    driver: bridge

volumes:
  alumni-dbdata:
    driver: local
